name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "Android sdkmanager not found"; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify application JavaScript
        run: npm run check
      - name: Prepare application assets
        run: npm run build:web
      - name: Generate native Android project
        run: npx cap add android
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        id: debug-keystore
        with:
          path: ~/.android/debug.keystore
          key: maintenance-supervisor-debug-keystore-v1
      - name: Create stable debug signing key when needed
        if: steps.debug-keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
      - name: Set increasing Android version code
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          candidates = [Path("android/app/build.gradle"), Path("android/app/build.gradle.kts")]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit("Android app Gradle file not found")
          source = gradle.read_text()
          source, count = re.subn(r'(?m)^(\\s*versionCode\\s*(?:=\\s*)?)\\d+', lambda m: m.group(1) + os.environ["BUILD_NUMBER"], source, count=1)
          if count != 1:
              raise SystemExit("Could not update Android versionCode")
          source = re.sub(r'(?m)^(\\s*versionName\\s*(?:=\\s*)?")[^"]*(")', lambda m: m.group(1) + "1.0." + os.environ["BUILD_NUMBER"] + m.group(2), source, count=1)
          gradle.write_text(source)
          PY
      - name: Declare microphone permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '<manifest '
          i = s.find('>', s.find(marker))
          if i < 0:
              raise SystemExit("Android manifest root element not found")
          permissions = '''\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.INTERNET" />\n'''
          if "android.permission.RECORD_AUDIO" not in s:
              s = s[:i+1] + permissions + s[i+1:]
          p.write_text(s)
          PY
      - name: Synchronize Capacitor
        run: npx cap sync android
      - name: Build installable debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-supervisor-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
